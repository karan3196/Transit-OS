<!doctype html>
<html><head><meta charset="utf-8"><title>When Every Minute Matters</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   "When Every Minute Matters" - photographic cut
   Canvas 2D. window.seek(t) fully defines the frame at t.
   Aesthetic: backlit silhouettes, volumetric light, atmospheric haze,
   depth of field, lens flare, grain. No HUD, no subtitles - supers only.
   ===================================================================== */
const W=1920,H=1080,cv=document.getElementById('c'),X=cv.getContext('2d',{alpha:false});

/* offscreen layers: bg gets blurred for depth of field */
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}
const Lbg=mk(),Lbgx=Lbg.getContext('2d');
const Lfg=mk(),Lfgx=Lfg.getContext('2d');
const Lgl=mk(),Lglx=Lgl.getContext('2d');   // glow / bloom pass

const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,p)=>a+(b-a)*p;
const P=(t,a,b)=>clamp((t-a)/((b-a)||1e-6),0,1);
const eo=p=>1-Math.pow(1-p,3), eo5=p=>1-Math.pow(1-p,5), ei=p=>p*p*p;
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const TAU=Math.PI*2;

/* deterministic value noise - used for handheld, clouds, flicker */
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
function vnoise(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u);}
function fbm(x){let v=0,a=.5,f=1;for(let i=0;i<4;i++){v+=a*vnoise(x*f);f*=2;a*=.5;}return v;}

/* ---------------------------------------------------------------- paint */
function grad(c,x0,y0,x1,y1,stops){
  const g=c.createLinearGradient(x0,y0,x1,y1);
  for(const [o,col] of stops) g.addColorStop(o,col);
  return g;
}
function rgrad(c,x,y,r0,r1,stops){
  const g=c.createRadialGradient(x,y,r0,x,y,r1);
  for(const [o,col] of stops) g.addColorStop(o,col);
  return g;
}
function glowDot(c,x,y,r,col,a){
  c.save(); c.globalCompositeOperation='lighter';
  c.fillStyle=rgrad(c,x,y,0,r,[[0,col],[0.35,col.replace('rgb','rgba').replace(')',',0.5)')],[1,'rgba(0,0,0,0)']]);
  c.globalAlpha=a; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); c.restore();
}
/* soft additive blob without needing rgba juggling */
function blob(c,x,y,r,col,a){
  c.save(); c.globalCompositeOperation='lighter'; c.globalAlpha=a;
  const g=c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); c.restore();
}
/* volumetric cone of light */
function beam(c,x,y,ang,len,spread,col,a){
  c.save(); c.globalCompositeOperation='lighter'; c.globalAlpha=a;
  c.translate(x,y); c.rotate(ang);
  const g=c.createLinearGradient(0,0,len,0);
  g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.beginPath(); c.moveTo(0,0);
  c.lineTo(len,-len*spread); c.lineTo(len,len*spread); c.closePath(); c.fill();
  c.restore();
}

/* sky with sun, haze bands and drifting cloud slabs */
function sky(c,pal,sunX,sunY,sunR,t,cloud){
  c.fillStyle=grad(c,0,0,0,H,pal); c.fillRect(0,0,W,H);
  if(cloud) for(let i=0;i<9;i++){
    const n=fbm(i*3.1+t*0.012), y=lerp(60,520,(i*0.113+n*0.25)%1);
    const w=lerp(500,1500,hash(i*7.7)), x=((t*(6+i*2.5)+hash(i)*2400)%(W+w*2))-w;
    c.save(); c.globalAlpha=0.10+0.16*n;
    c.fillStyle=grad(c,0,y-70,0,y+70,[[0,'rgba(255,255,255,0)'],[.5,'rgba(255,228,200,0.9)'],[1,'rgba(255,255,255,0)']]);
    c.beginPath(); c.ellipse(x,y,w,46+40*n,0,0,TAU); c.fill(); c.restore();
  }
  if(sunR>0){
    blob(c,sunX,sunY,sunR*7,'rgba(255,190,120,0.55)',1);
    blob(c,sunX,sunY,sunR*2.2,'rgba(255,235,205,0.95)',1);
    c.save(); c.globalCompositeOperation='lighter'; c.fillStyle='rgba(255,246,230,0.95)';
    c.beginPath(); c.arc(sunX,sunY,sunR,0,TAU); c.fill(); c.restore();
  }
}
/* distance haze over everything drawn so far, below horizon */
function hazeBand(c,y0,y1,col,a0,a1){
  c.save(); c.fillStyle=grad(c,0,y0,0,y1,[[0,col.replace(')',`,${a0})`).replace('rgb','rgba')],
                                          [1,col.replace(')',`,${a1})`).replace('rgb','rgba')]]);
  c.fillRect(0,y0,W,y1-y0); c.restore();
}

/* ground plane in perspective: returns scale at a given screen y */
function persp(horizon,y){ return clamp((y-horizon)/(H-horizon),0,1); }

/* road receding to a vanishing point */
function road(c,horizon,vpx,halfTop,halfBot,colRoad,t,dashSpeed,lit){
  c.save();
  c.fillStyle=colRoad;
  c.beginPath();
  c.moveTo(vpx-halfTop,horizon); c.lineTo(vpx+halfTop,horizon);
  c.lineTo(vpx+halfBot,H); c.lineTo(vpx-halfBot,H); c.closePath(); c.fill();
  /* wet/asphalt sheen */
  c.globalCompositeOperation='lighter';
  c.fillStyle=grad(c,0,horizon,0,H,[[0,'rgba(150,180,220,0.10)'],[1,'rgba(0,0,0,0)']]);
  c.fill();
  c.globalCompositeOperation='source-over';
  /* centre dashes, spaced in perspective */
  for(let i=0;i<26;i++){
    let u=((i/26)+ (t*dashSpeed)%(1/26))%1;
    u=Math.pow(u,2.6);                         // perspective bunching
    const y=lerp(horizon,H,u), s=persp(horizon,y);
    const w=lerp(halfTop,halfBot,u);
    c.fillStyle=`rgba(238,232,214,${0.10+0.65*s})`;
    const dw=Math.max(1,3*s+1.2), dh=Math.max(1,34*s);
    c.fillRect(vpx-dw/2+ (0), y, dw, dh);
    void w;
  }
  /* edge lines */
  [-1,1].forEach(sgn=>{
    c.beginPath(); c.moveTo(vpx+sgn*halfTop*0.92,horizon); c.lineTo(vpx+sgn*halfBot*0.94,H);
    c.strokeStyle=`rgba(236,230,212,${lit?0.5:0.28})`; c.lineWidth=3; c.stroke();
  });
  c.restore();
}

/* ---------------------------------------------------------------- objects
   Everything is drawn as a filled silhouette plus a rim light. Backlit
   silhouettes are what make this read as photographed rather than drawn. */

function carBody(c,s,col){
  c.beginPath();
  c.moveTo(-104*s,30*s);
  c.lineTo(-104*s,6*s);
  c.quadraticCurveTo(-102*s,-4*s,-88*s,-9*s);
  c.lineTo(-58*s,-20*s);
  c.quadraticCurveTo(-40*s,-42*s,-6*s,-44*s);
  c.lineTo(30*s,-44*s);
  c.quadraticCurveTo(66*s,-43*s,86*s,-21*s);
  c.lineTo(98*s,-15*s);
  c.quadraticCurveTo(106*s,-11*s,106*s,2*s);
  c.lineTo(106*s,30*s);
  c.closePath();
  c.fillStyle=col; c.fill();
}
/* side-on car. dir=1 faces right. rim = rim-light colour */
function car(c,x,y,s,col,rim,opt){
  opt=opt||{};
  c.save(); c.translate(x,y); if(opt.flip) c.scale(-1,1);
  /* contact shadow */
  c.save(); c.globalAlpha=0.55;
  c.fillStyle=rgrad(c,0,30*s,0,120*s,[[0,'rgba(0,0,0,0.85)'],[1,'rgba(0,0,0,0)']]);
  c.beginPath(); c.ellipse(0,32*s,118*s,16*s,0,0,TAU); c.fill(); c.restore();
  carBody(c,s,col);
  /* glass - slightly lighter than body so the cabin reads */
  if(opt.glass){
    c.save(); c.globalAlpha=0.55; c.fillStyle=opt.glass;
    c.beginPath();
    c.moveTo(-50*s,-19*s); c.quadraticCurveTo(-34*s,-38*s,-6*s,-39*s);
    c.lineTo(30*s,-39*s); c.quadraticCurveTo(58*s,-38*s,74*s,-20*s);
    c.closePath(); c.fill(); c.restore();
  }
  /* rim light along the roof and shoulder */
  if(rim){
    c.save(); c.globalCompositeOperation='lighter'; c.strokeStyle=rim;
    c.lineWidth=Math.max(1.4,2.4*s); c.lineJoin='round';
    c.beginPath();
    c.moveTo(-58*s,-20*s); c.quadraticCurveTo(-40*s,-42*s,-6*s,-44*s);
    c.lineTo(30*s,-44*s); c.quadraticCurveTo(66*s,-43*s,86*s,-21*s);
    c.lineTo(98*s,-15*s); c.stroke(); c.restore();
  }
  /* wheels */
  c.fillStyle='rgba(6,8,12,1)';
  [[-58,30],[58,30]].forEach(([wx,wy])=>{
    c.beginPath(); c.arc(wx*s,wy*s,23*s,0,TAU); c.fill();
  });
  c.restore();
}

/* quadcopter silhouette, 3/4 front. spin drives the rotor discs */
function drone(c,x,y,s,col,spin,opt){
  opt=opt||{};
  c.save(); c.translate(x,y); if(opt.rot) c.rotate(opt.rot);
  const arms=[[-46,-12,21],[46,-12,21],[-30,-21,15],[30,-21,15]];
  c.strokeStyle=col; c.lineWidth=Math.max(1,3.2*s); c.lineCap='round';
  arms.forEach(([ax,ay])=>{c.beginPath();c.moveTo(0,-2*s);c.lineTo(ax*s,ay*s);c.stroke();});
  /* rotor discs - motion-blurred */
  arms.forEach(([ax,ay,r],i)=>{
    c.save(); c.translate(ax*s,ay*s);
    c.globalAlpha=0.22+0.10*Math.sin(spin*3+i);
    c.fillStyle=col;
    c.beginPath(); c.ellipse(0,0,r*s,r*s*0.24,0,0,TAU); c.fill();
    c.globalAlpha=0.9; c.strokeStyle=col; c.lineWidth=Math.max(0.8,1.6*s);
    c.beginPath(); c.ellipse(0,0,r*s,r*s*0.24,0,0,TAU); c.stroke();
    c.restore();
  });
  /* body */
  c.fillStyle=col;
  c.beginPath(); c.roundRect?c.roundRect(-18*s,-12*s,36*s,21*s,8*s):c.rect(-18*s,-12*s,36*s,21*s);
  c.fill();
  c.beginPath(); c.arc(0,13*s,6.5*s,0,TAU); c.fill();
  if(opt.payload){ c.fillStyle=opt.payload; c.fillRect(-13*s,17*s,26*s,19*s); }
  /* navigation lights */
  if(opt.nav){
    blob(c,-46*s,-12*s,26*s,'rgba(255,70,90,0.95)',0.85);
    blob(c, 46*s,-12*s,26*s,'rgba(90,255,170,0.95)',0.85);
  }
  c.restore();
}

/* standing human silhouette. Kept small/backlit - never a close-up. */
function figure(c,x,y,h,col,pose){
  pose=pose||0;
  const u=h/100;
  c.save(); c.translate(x,y); c.fillStyle=col; c.strokeStyle=col;
  c.lineCap='round'; c.lineJoin='round';
  c.lineWidth=10*u;                                            // legs
  c.beginPath(); c.moveTo(-4*u,-46*u); c.lineTo(-7*u,-24*u); c.lineTo(-6*u,-2*u); c.stroke();
  c.beginPath(); c.moveTo(5*u,-46*u); c.lineTo(8*u,-24*u); c.lineTo(9*u,-2*u); c.stroke();
  c.beginPath();                                               // torso
  c.moveTo(-11*u,-78*u); c.quadraticCurveTo(0,-83*u,11*u,-78*u);
  c.quadraticCurveTo(14*u,-60*u,10*u,-43*u);
  c.quadraticCurveTo(0,-39*u,-10*u,-43*u);
  c.quadraticCurveTo(-14*u,-60*u,-11*u,-78*u); c.closePath(); c.fill();
  c.fillRect(-3.2*u,-87*u,6.4*u,9*u);                          // neck
  c.beginPath(); c.ellipse(0,-93*u,7.6*u,8.8*u,0,0,TAU); c.fill();
  c.lineWidth=7.4*u;                                           // arms
  if(pose===1){
    c.beginPath(); c.moveTo(10*u,-75*u); c.lineTo(17*u,-63*u); c.lineTo(9*u,-87*u); c.stroke();
    c.beginPath(); c.moveTo(-10*u,-75*u); c.lineTo(-14*u,-53*u); c.lineTo(-11*u,-42*u); c.stroke();
  } else if(pose===2){
    c.beginPath(); c.moveTo(10*u,-75*u); c.lineTo(22*u,-64*u); c.lineTo(34*u,-66*u); c.stroke();
    c.beginPath(); c.moveTo(-10*u,-75*u); c.lineTo(-14*u,-52*u); c.stroke();
  } else {
    c.beginPath(); c.moveTo(-10*u,-75*u); c.lineTo(-15*u,-53*u); c.lineTo(-12*u,-40*u); c.stroke();
    c.beginPath(); c.moveTo(10*u,-75*u); c.lineTo(15*u,-53*u); c.lineTo(12*u,-40*u); c.stroke();
  }
  c.restore();
}

/* skyline band: layered, hazier with distance */
const _skyCache=new Map();
function skyline(c,baseY,hgt,col,seed,alpha,lights,t){
  const key=baseY+'|'+hgt+'|'+col+'|'+seed+'|'+(lights?1:0);
  let cn=_skyCache.get(key);
  if(!cn){
    cn=document.createElement('canvas'); cn.width=W+240; cn.height=H;
    const k=cn.getContext('2d');
    k.fillStyle=col;
    let x=-60;
    for(let i=0;x<W+200;i++){
      const w=lerp(60,190,hash(seed+i*1.7)), h=lerp(hgt*0.35,hgt,hash(seed+i*3.3));
      k.fillStyle=col;
      k.fillRect(x,baseY-h,w,h);
      const r=hash(seed+i*11.3);
      if(r>0.72) k.fillRect(x+w*0.18,baseY-h-lerp(14,44,r),w*0.34,lerp(14,44,r));
      else if(r>0.52) k.fillRect(x+w*0.62,baseY-h-lerp(10,30,r),4,lerp(22,60,r));
      if(r<0.22) k.fillRect(x-6,baseY-h*0.62,w+12,7);
      if(lights){
        k.fillStyle='rgb(255,208,150)';
        for(let m=0;m<Math.floor(h/34);m++) for(let j=0;j<Math.floor(w/30);j++){
          if(hash(seed+i*13+m*7+j*3)>0.62){
            k.globalAlpha=0.45+0.55*hash(seed+i+m*5+j);
            k.fillRect(x+8+j*30,baseY-h+12+m*34,7,9);
          }
        }
        k.globalAlpha=1;
      }
      x+=w+lerp(10,40,hash(seed+i*5.1));
    }
    _skyCache.set(key,cn);
  }
  c.save(); c.globalAlpha=alpha; c.drawImage(cn,0,0); c.restore();
}

/* dust motes / rain, drifting in the light */
function motes(c,t,n,col,a,drift,area){
  c.save(); c.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const sx=hash(i*1.3), sy=hash(i*7.7);
    const x=((sx*W + t*drift*(0.4+sy))%(W+120))-60;
    const y=area[1]+((sy*(area[3]-area[1]) + t*8*(0.3+sx))%(area[3]-area[1]));
    const r=lerp(1.0,2.8,hash(i*3.1));
    c.globalAlpha=a*(0.25+0.75*Math.abs(Math.sin(t*0.9+i)));
    c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
  }
  c.restore();
}

/* =====================================================================
   Shots
   ===================================================================== */
const SC=mk(), S=SC.getContext('2d');            // scene, pre-grade
const SHOTS=[];
function shot(t0,t1,draw){ SHOTS.push({t0,t1,draw}); }

const SKY_DAWN=[[0,'#101d38'],[0.42,'#3a3550'],[0.72,'#9a6048'],[1,'#e0a271']];
const SKY_GOLD=[[0,'#1d3050'],[0.40,'#4a4a63'],[0.74,'#b8734a'],[1,'#f0bb7c']];
const SKY_DUSK=[[0,'#0a1228'],[0.45,'#1c2142'],[0.80,'#4b3350'],[1,'#8a5354']];
const SKY_NIGHT=[[0,'#03050c'],[0.55,'#070c18'],[1,'#0e1626']];
const SKY_DAY=[[0,'#2e5c94'],[0.5,'#7fa6c8'],[1,'#cfd8dc']];

/* 01 - dawn highway, title plate ------------------------------------- */
shot(0,5.30,(c,lt,t)=>{
  const hz=560;
  sky(c,SKY_DAWN,1290,520,42,t,true);
  skyline(c,hz+6,110,'#0d1526',3.1,0.55,false,t);
  /* tree line */
  c.save(); c.fillStyle='#0a1220'; c.globalAlpha=0.9;
  for(let x=-40;x<W+60;x+=34){ const h=lerp(26,70,fbm(x*0.02+4));
    c.beginPath(); c.ellipse(x,hz+16,26,h*0.6,0,0,TAU); c.fill(); }
  c.restore();
  hazeBand(c,hz-140,hz+70,'rgb(226,168,124)',0.0,0.42);
  /* fields */
  c.fillStyle=grad(c,0,hz,0,H,[[0,'#16202c'],[1,'#070b12']]); c.fillRect(0,hz,W,H-hz);
  road(c,hz+8,960,17,760,'#12161f',t,0.16,false);
  /* the car, receding */
  const p=eio(P(lt,0,5.3));
  const s=lerp(1.20,0.56,p), y=lerp(915,690,p);
  car(c,960+lerp(30,6,p),y,s,'#080c14','rgba(255,196,140,0.85)',{glass:'#1b2536'});
  blob(c,960-40*s,y-6*s,60*s,'rgba(255,90,70,0.9)',0.55);
  blob(c,960+40*s,y-6*s,60*s,'rgba(255,90,70,0.9)',0.55);
  /* a drone, very high and small */
  drone(c,lerp(300,1500,P(lt,0,5.3)),196,0.42,'rgba(10,14,22,0.85)',t*30,{});
  motes(c,t,50,'rgba(255,214,170,1)',0.20,16,[0,380,W,980]);
});

/* 02 - showroom handover, backlit ------------------------------------ */
shot(5.30,8.20,(c,lt,t)=>{
  c.fillStyle='#090c12'; c.fillRect(0,0,W,H);
  /* window wall */
  c.save(); c.filter='blur(2px)';
  c.fillStyle=grad(c,0,120,0,760,[[0,'#ffd9a8'],[0.6,'#f0b878'],[1,'#b07a52']]);
  c.fillRect(150,120,1620,640);
  c.restore();
  /* mullions */
  c.fillStyle='#0a0d14';
  for(let x=150;x<=1770;x+=270) c.fillRect(x-9,110,18,660);
  c.fillRect(140,752,1640,16);
  /* light spill on the floor */
  c.fillStyle=grad(c,0,760,0,H,[[0,'rgba(255,206,150,0.40)'],[1,'rgba(255,190,130,0.02)']]);
  c.fillRect(0,760,W,H-760);
  /* floor reflection of the window */
  c.save(); c.globalAlpha=0.16; c.filter='blur(9px)';
  c.fillStyle='#f0b878'; c.fillRect(200,770,1520,190); c.restore();
  /* car + family, silhouetted */
  car(c,1330,930,1.80,'#05070c','rgba(255,198,150,0.85)',{});
  figure(c,470,946,330,'#05070c',0);
  figure(c,616,940,318,'#05070c',2);
  figure(c,724,950,214,'#05070c',0);
  /* clock */
  c.save(); c.strokeStyle='rgba(255,222,180,0.5)'; c.lineWidth=5;
  c.beginPath(); c.arc(1700,236,44,0,TAU); c.stroke();
  c.beginPath(); c.moveTo(1700,236); c.lineTo(1700,206); c.stroke();
  c.beginPath(); c.moveTo(1700,236); c.lineTo(1700+Math.sin(t*1.2)*26,236-Math.cos(t*1.2)*26); c.stroke();
  c.restore();
  beam(c,600,90,1.15,1300,0.12,'rgba(255,214,164,0.22)',1);
  beam(c,1140,90,1.28,1200,0.10,'rgba(255,214,164,0.18)',1);
  motes(c,t,120,'rgba(255,224,186,1)',0.30,10,[200,220,W,940]);
});

/* 03 - stranded on the highway --------------------------------------- */
shot(8.20,10.25,(c,lt,t)=>{
  const hz=520;
  sky(c,SKY_GOLD,540,470,36,t,true);
  skyline(c,hz+10,74,'#101a2c',9.2,0.45,false,t);
  hazeBand(c,hz-120,hz+60,'rgb(236,186,132)',0,0.40);
  c.fillStyle=grad(c,0,hz,0,H,[[0,'#2a3040'],[1,'#11161f']]); c.fillRect(0,hz,W,H-hz);
  road(c,hz+6,1180,20,1500,'#1d2430',t,0.06,true);
  blob(c,540,560,760,'rgba(255,190,130,1)',0.26);
  /* guard rail */
  c.strokeStyle='rgba(180,190,200,0.35)'; c.lineWidth=5;
  c.beginPath(); c.moveTo(0,742); c.lineTo(W,690); c.stroke();
  car(c,660,900,2.05,'#06090f','rgba(255,206,150,0.9)',{glass:'#141c2a'});
  figure(c,1010,916,300,'#06090f',1);
  /* hazards */
  const hz1=(Math.sin(t*5.2)>0)?1:0.12;
  blob(c,660-200,852,86,'rgba(255,150,40,1)',0.8*hz1);
  blob(c,660+200,852,86,'rgba(255,150,40,1)',0.8*hz1);
  /* passing traffic streaks */
  for(let i=0;i<3;i++){

/* 18 - coordinated response, high and wide ------------------------------ */
shot(46.80,48.60,(c,lt,t)=>{
  c.fillStyle='#05080e'; c.fillRect(0,0,W,H);

  const roads=[[-200,760,2200,560],[-200,300,2200,880],[820,-100,1120,1200]];
  roads.forEach((r,k)=>{

    c.beginPath(); c.moveTo(r[0],r[1]); c.lineTo(r[2],r[3]); c.stroke(); c.restore();
    for(let i=0;i<16;i++){
      const u=((t*0.16+i/16+k*0.2)%1);

  .forEach((u,i)=>{

/* 19 - the network, dusk from height ------------------------------------ */
shot(48.60,54.60,(c,lt,t)=>{

shot(57.75,60.0,(c,lt,t)=>{

/* =====================================================================
   Post: bloom, split-tone grade, vignette, grain, handheld
   ===================================================================== */
const SC2=mk(), S2=SC2.getContext('2d');

/* fixed grain plate, tiled with a per-frame offset */
const NT=document.createElement('canvas'); NT.width=NT.height=512;
(function(){
  const n=NT.getContext('2d'), id=n.createImageData(512,512);
  for(let i=0;i<512*512;i++){
    const v=128+(hash(i*0.3719)-0.5)*96;
    id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v; id.data[i*4+3]=255;
  }
  n.putImageData(id,0,0);
})();
const GP=document.createElement('canvas'); GP.width=W+512; GP.height=H+512;
(function(){ const g=GP.getContext('2d');
  for(let y=0;y<H+512;y+=512) for(let x=0;x<W+512;x+=512) g.drawImage(NT,x,y);
})();

const BW=480,BH=270;
const BL=document.createElement('canvas'); BL.width=BW; BL.height=BH;
const Bx=BL.getContext('2d');

function post(t){
  const hx=(fbm(t*1.7)-0.5)*9, hy=(fbm(t*2.1+31)-0.5)*9, hr=(fbm(t*1.3+7)-0.5)*0.004;
  X.save();
  X.filter='contrast(1.06) saturate(0.96) brightness(1.10)';
  X.translate(960+hx,540+hy); X.rotate(hr); X.scale(1.04,1.04); X.translate(-960,-540);
  X.drawImage(SC,0,0);
  X.restore();

  Bx.clearRect(0,0,BW,BH);
  Bx.save(); Bx.filter='blur(7px) brightness(1.45) contrast(1.3)';
  Bx.drawImage(SC,0,0,BW,BH); Bx.restore();
  X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.19;
  X.imageSmoothingQuality='high'; X.drawImage(BL,0,0,W,H); X.restore();

  X.save(); X.globalCompositeOperation='overlay'; X.globalAlpha=0.17;
  X.fillStyle=grad(X,0,0,0,H,[[0,'#2f74ad'],[0.52,'#7f7f7f'],[1,'#cc8348']]);
  X.fillRect(0,0,W,H); X.restore();
}
function vignetteGrain(t){
  X.save(); X.globalCompositeOperation='multiply';
  X.fillStyle=rgrad(X,960,520,380,1220,[[0,'rgb(255,255,255)'],[0.68,'rgb(214,214,222)'],[1,'rgb(112,112,132)']]);
  X.fillRect(0,0,W,H); X.restore();

  X.save(); X.globalCompositeOperation='overlay'; X.globalAlpha=0.085;
  const f=Math.floor(t*30);
  X.drawImage(GP,-Math.floor(hash(f*1.7)*512),-Math.floor(hash(f*3.1)*512));
  X.restore();
}

/* =====================================================================
   Type
   ===================================================================== */
function setType(px,weight,ls){
  X.font=`${weight} ${px}px Inter, 'Liberation Sans', sans-serif`;
  X.letterSpacing=`${ls||0}px`;
}
function scrim(a){
  X.save(); X.fillStyle=grad(X,0,H-620,0,H,[[0,'rgba(0,0,0,0)'],[1,`rgba(0,0,0,${0.72*a})`]]);
  X.fillRect(0,H-620,W,620); X.restore();
}
function rise(a,px){ return (1-eo5(a))*px; }

function drawTitle(t){
  const a=Math.min(P(t,0.7,1.5),1-P(t,4.3,5.0));
  if(a<=0.002) return;
  X.save(); X.globalAlpha=a; scrim(a);
  X.textBaseline='alphabetic'; X.fillStyle='#3ae0ff';
  setType(22,600,12);
  X.globalAlpha=a*P(t,0.8,1.5);
  X.fillText('A CONCEPT FILM',150,706);
  X.fillStyle='#fff';
  setType(96,800,-1);
  [['WHEN EVERY MINUTE',806,1.05],['MATTERS',906,1.20]].forEach(([s,y,st])=>{
    const p=P(t,st,st+0.9);
    X.globalAlpha=a*P(t,st,st+0.55);
    X.fillText(s,150,y+rise(p,42));
  });
  X.globalAlpha=a; X.fillStyle='#3ae0ff';
  X.fillRect(150,954,lerp(0,260,eo(P(t,1.9,2.9))),3);
  X.restore();
}

const SUPERS=[
  [30.90,32.45,'Faster Parts.','Faster Repairs.'],
  [40.10,41.45,'Assess First.','Respond Better.'],
  [46.90,48.45,'Improved Visibility.','Faster Coordination.']
];
function drawSupers(t){
  for(const [t0,t1,l1,l2] of SUPERS){
    const a=Math.min(P(t,t0-0.28,t0+0.12),1-P(t,t1-0.22,t1+0.10));
    if(a<=0.002) continue;
    X.save(); X.globalAlpha=a; scrim(a);
    X.textBaseline='alphabetic'; X.fillStyle='#fff'; setType(84,800,-1);
    X.globalAlpha=a; X.fillText(l1,150,806+rise(P(t,t0-0.28,t0+0.62),36));
    X.fillText(l2,150,902+rise(P(t,t0-0.18,t0+0.72),36));
    X.restore();
  }
}

/* ecosystem graphic, drawn sharp over shot 19 */
const ENODES=[[300,360,0],[320,760,0],[590,300,1],[560,650,1],[1030,380,1],[1150,740,1],
 [430,470,2],[720,860,2],[880,260,2],[1270,280,2],[1360,570,2],[700,500,2],[960,880,2],[1450,800,2],
 [470,580,3],[790,380,3],[900,620,3],[1180,500,3],[1270,860,3],[600,790,3],[1420,400,3],
 [380,850,4],[1000,560,4],[1340,700,4],[650,220,4]];
const ETY=[['PLANTS','#5b9dff'],['PARTS DISTRIBUTION CENTRES','#3ae0ff'],
           ['DEALERSHIPS','#9fb2cc'],['SERVICE WORKSHOPS','#2fe3a0'],['RSA TEAMS','#ffb020']];
const ELINKS=[[2,15],[4,17],[5,18],[3,14],[22,16]];
function drawEco(t){
  const T0=48.60,T1=54.60;
  const a=Math.min(P(t,T0+0.1,T0+0.8),1-P(t,T1-0.6,T1));
  if(a<=0.002) return;
  const lt=t-T0;
  X.save(); X.globalAlpha=a;
  X.fillStyle='rgba(4,7,15,0.55)'; X.fillRect(0,0,W,H);
  ELINKS.forEach(([ia,ib],i)=>{
    const A=ENODES[ia],B=ENODES[ib];
    const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2-Math.abs(B[0]-A[0])*0.22-40;
    const p=eo(P(lt,2.0+i*0.28,3.1+i*0.28));
    X.save(); X.strokeStyle='rgba(58,224,255,0.22)'; X.lineWidth=2;
    X.beginPath(); X.moveTo(A[0],A[1]); X.quadraticCurveTo(mx,my,B[0],B[1]); X.stroke();
    X.restore();
    if(p>0){
      X.save(); X.strokeStyle='rgba(58,224,255,0.95)'; X.lineWidth=2.8; X.lineCap='round';
      X.beginPath(); X.moveTo(A[0],A[1]);
      const m=1-p, cx=lerp(A[0],mx,p), cy=lerp(A[1],my,p);
      const ex=m*m*A[0]+2*m*p*mx+p*p*B[0], ey=m*m*A[1]+2*m*p*my+p*p*B[1];
      X.quadraticCurveTo(cx,cy,ex,ey); X.stroke();
      blob(X,ex,ey,16,'rgba(58,224,255,1)',0.9*(p<1?1:0));
      X.restore();
    }
  });
  ENODES.forEach(([x,y,ti],i)=>{
    const s=0.3+((i*37)%25)*0.045, na=P(lt,s,s+0.5);
    if(na<=0) return;
    const c=ETY[ti][1], k=lerp(0.5,1,eo5(na));
    X.save(); X.globalAlpha=a*na*(ti===2?0.72:0.98); X.translate(x,y); X.scale(k,k);
    X.strokeStyle=c; X.lineWidth=2.6; X.fillStyle='rgba(7,16,31,0.9)';
    X.beginPath();
    if(ti===0) X.rect(-11,-11,22,22);
    else if(ti===1){X.moveTo(0,-13);X.lineTo(13,0);X.lineTo(0,13);X.lineTo(-13,0);X.closePath();}
    else if(ti===2) X.arc(0,0,8,0,TAU);
    else if(ti===3) X.rect(-10,-10,20,20);
    else {X.moveTo(0,-13);X.lineTo(12,8);X.lineTo(-12,8);X.closePath();}
    X.fill(); X.stroke(); X.restore();
  });
  X.textBaseline='alphabetic'; X.fillStyle='#3ae0ff';
  setType(22,700,7); X.globalAlpha=a*P(lt,0.4,1.1);
  X.fillText('SELECTIVE CORRIDORS · CRITICAL LINKS ONLY',150,158);
  X.globalAlpha=a*P(lt,1.1,1.8);
  let lx=150; setType(19,600,3);
  ETY.forEach(([n,c])=>{
    X.fillStyle=c; X.beginPath(); X.arc(lx,972,7,0,TAU); X.fill();
    X.fillStyle='#b9c6dc'; X.fillText(n,lx+20,979);
    lx+=X.measureText(n).width+96;
  });
  X.restore();
}

function drawEnd(t){
  const F=57.75, a=P(t,F,F+0.5);
  if(a<=0.002) return;
  X.save(); X.globalAlpha=a; X.textAlign='center'; X.textBaseline='alphabetic';
  X.fillStyle='#fff'; setType(56,700,0);
  X.globalAlpha=a*P(t,F+0.15,F+0.8);
  X.fillText('Drone Services for Smarter Customer Support',960,486+rise(P(t,F+0.15,F+1.1),18));
  X.globalAlpha=a; X.fillStyle='#3ae0ff';
  const ew=lerp(0,420,eo(P(t,F+0.5,F+1.4)));
  X.fillRect(960-ew/2,540,ew,2);
  X.globalAlpha=a*P(t,F+0.7,F+1.35); X.fillStyle='#b9c6dc'; setType(30,400,2);
  X.fillText('Exploring New Possibilities for Customer Experience',960,606);
  X.globalAlpha=a*P(t,F+1.05,F+1.7); X.fillStyle='#fff'; setType(38,700,1);
  X.fillText('Maruti Suzuki',960,726+rise(P(t,F+1.05,F+1.8),14));
  X.restore(); X.textAlign='left';
}

/* =====================================================================
   seek
   ===================================================================== */
const XFADE={5.30:0.40, 13.25:0.40, 21.60:0.40, 32.85:0.40, 41.85:0.45, 48.60:0.50, 54.60:0.45, 57.75:0.45};
function shotAt(t){
  for(let i=0;i<SHOTS.length;i++) if(t>=SHOTS[i].t0&&t<SHOTS[i].t1) return i;
  return t<0?0:SHOTS.length-1;
}
function seek(t){
  const i=shotAt(t), sh=SHOTS[i];
  S.save(); S.setTransform(1,0,0,1,0,0); S.globalAlpha=1;
  S.fillStyle='#000'; S.fillRect(0,0,W,H);
  const xf=XFADE[sh.t0]||0;
  const into=t-sh.t0;
  if(xf>0 && into<xf && i>0){
    const prev=SHOTS[i-1];
    S.save(); prev.draw(S,t-prev.t0,t); S.restore();
    S2.save(); S2.setTransform(1,0,0,1,0,0); S2.globalAlpha=1;
    S2.fillStyle='#000'; S2.fillRect(0,0,W,H);
    sh.draw(S2,into,t); S2.restore();
    S.globalAlpha=clamp(into/xf,0,1); S.drawImage(SC2,0,0); S.globalAlpha=1;
  } else {
    sh.draw(S,into,t);
  }
  S.restore();

  post(t);
  drawTitle(t); drawSupers(t); drawEco(t); drawEnd(t);
  vignetteGrain(t);

  const fade=Math.min(P(t,0,1.0),1-P(t,59.55,60.0));
  if(fade<1){ X.save(); X.globalAlpha=1-fade; X.fillStyle='#000'; X.fillRect(0,0,W,H); X.restore(); }
}
window.seek=seek; window.__ready=true; seek(0);
