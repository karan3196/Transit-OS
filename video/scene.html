<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>When Every Minute Matters</title>
<style>
  html,body{margin:0;padding:0;background:#04060d;}
  #stage{width:1920px;height:1080px;overflow:hidden;position:relative;}
  svg{display:block;font-family:'Inter','Liberation Sans',sans-serif;}
  text{fill:#e8eefc;dominant-baseline:middle;}
</style>
</head>
<body>
<div id="stage"><svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<script>
/* =====================================================================
   "When Every Minute Matters" - 60s concept animatic
   Deterministic renderer: window.seek(t) fully defines the frame at t.
   ===================================================================== */
const NS='http://www.w3.org/2000/svg';
const W=1920,H=1080;
const svg=document.getElementById('root');

function E(tag,attrs,parent){
  const n=document.createElementNS(NS,tag);
  if(attrs) for(const k in attrs) n.setAttribute(k,attrs[k]);
  (parent||svg).appendChild(n);
  return n;
}
function G(parent,attrs){ return E('g',attrs||{},parent); }
function T(parent,str,attrs){
  const n=E('text',attrs||{},parent);
  n.textContent=str;
  return n;
}
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,p)=>a+(b-a)*p;
const P=(t,a,b)=>clamp((t-a)/(b-a||1e-6),0,1);
const eo=p=>1-Math.pow(1-p,3);
const eo5=p=>1-Math.pow(1-p,5);
const ei=p=>p*p*p;
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const pulse=(t,hz)=>0.5+0.5*Math.sin(t*Math.PI*2*hz);

const C={
  bg0:'#0a1224', bg1:'#050810',
  line:'#1e2b47', line2:'#2b3c60',
  dim:'#54658a', mut:'#93a4c4', txt:'#e9effc',
  blue:'#4f8dff', cyan:'#3ae0ff', amber:'#ffb020',
  red:'#ff4d5e', green:'#2fe3a0'
};

/* ---------- defs ---------- */
const defs=E('defs',{},svg);
(function(){
  const bg=E('linearGradient',{id:'bgg',x1:0,y1:0,x2:0.35,y2:1},defs);
  E('stop',{offset:'0%','stop-color':'#0d1730'},bg);
  E('stop',{offset:'55%','stop-color':'#070d1c'},bg);
  E('stop',{offset:'100%','stop-color':'#04060e'},bg);

  const vg=E('radialGradient',{id:'vig',cx:'50%',cy:'46%',r:'72%'},defs);
  E('stop',{offset:'55%','stop-color':'#000000','stop-opacity':0},vg);
  E('stop',{offset:'100%','stop-color':'#000000','stop-opacity':0.72},vg);

  const gp=E('pattern',{id:'grid',width:64,height:64,patternUnits:'userSpaceOnUse'},defs);
  E('path',{d:'M64 0 L0 0 0 64',fill:'none',stroke:'#31446e','stroke-width':1,opacity:0.30},gp);

  const scr=E('linearGradient',{id:'scrim',x1:0,y1:0,x2:0,y2:1},defs);
  E('stop',{offset:'0%','stop-color':'#04060e','stop-opacity':0},scr);
  E('stop',{offset:'100%','stop-color':'#04060e','stop-opacity':0.92},scr);

  const hz=E('linearGradient',{id:'horiz',x1:0,y1:0,x2:0,y2:1},defs);
  E('stop',{offset:'0%','stop-color':'#4f8dff','stop-opacity':0},hz);
  E('stop',{offset:'100%','stop-color':'#4f8dff','stop-opacity':0.30},hz);
})();

/* ---------- background ---------- */
const bgLayer=G(svg);
E('rect',{x:0,y:0,width:W,height:H,fill:'url(#bgg)'},bgLayer);
const gridRect=E('rect',{x:-64,y:-64,width:W+128,height:H+128,fill:'url(#grid)',opacity:0.55},bgLayer);
const bgTint=E('rect',{x:0,y:0,width:W,height:H,fill:C.red,opacity:0},bgLayer);

/* ---------- scene layer ---------- */
const sceneLayer=G(svg);

/* ---------- foreground / overlays ---------- */
const fg=G(svg);
E('rect',{x:0,y:0,width:W,height:H,fill:'url(#vig)'},fg);
E('rect',{x:0,y:H-300,width:W,height:300,fill:'url(#scrim)'},fg);

/* scene label, top-left */
const labWrap=G(fg,{opacity:0});
const labDot=E('circle',{cx:96,cy:92,r:4,fill:C.blue},labWrap);
const labNum=T(labWrap,'01',{x:116,y:92,'font-size':16,'font-weight':700,'letter-spacing':3,fill:C.blue});
const labTxt=T(labWrap,'',{x:150,y:92,'font-size':16,'font-weight':500,'letter-spacing':5,fill:C.mut});

/* caption (VO) - two slots, so consecutive lines cross-fade */
const capSlots=[0,1].map(()=>{
  const w=G(fg,{opacity:0});
  const bar=E('rect',{x:960,y:934,width:0,height:2,fill:C.blue,opacity:0.85},w);
  const txt=T(w,'',{x:960,y:982,'font-size':38,'font-weight':400,'text-anchor':'middle',fill:'#f2f6ff'});
  return {w,bar,txt};
});

/* super (statement card) */
const supWrap=G(fg,{opacity:0});
const supRule=E('rect',{x:860,y:560,width:200,height:2,fill:C.cyan},supWrap);
const supTxt=T(supWrap,'',{x:960,y:626,'font-size':66,'font-weight':700,'text-anchor':'middle','letter-spacing':1,fill:'#ffffff'});
const supScrim=E('rect',{x:0,y:0,width:W,height:H,fill:'#04060e',opacity:0},fg);

/* letterbox bars - filmic */
E('rect',{x:0,y:0,width:W,height:44,fill:'#04060e'},fg);
E('rect',{x:0,y:H-44,width:W,height:44,fill:'#04060e'},fg);

/* =====================================================================
   Reusable pieces
   ===================================================================== */
function strokeAttrs(col,w,op){
  return {fill:'none',stroke:col,'stroke-width':w||2.4,'stroke-linecap':'round','stroke-linejoin':'round',opacity:op===undefined?1:op};
}

/* Car, side profile, faces +x. ~210 wide, wheels on y=+30 */
function carSide(parent,col,w){
  const g=G(parent);
  col=col||C.txt; w=w||2.6;
  E('path',{d:'M-104,30 L-104,8 C-104,0 -99,-5 -91,-8 L-58,-20 C-42,-36 -22,-44 8,-44 L36,-44 C58,-44 74,-36 86,-21 L98,-15 C104,-12 106,-7 106,0 L106,30 Z',
    fill:'#0a1326',stroke:col,'stroke-width':w,'stroke-linejoin':'round'},g);
  E('path',{d:'M-50,-19 L-28,-37 C-20,-40 -12,-41 -4,-41 L-4,-19 Z',fill:'none',stroke:col,'stroke-width':w*0.7,opacity:0.75},g);
  E('path',{d:'M6,-41 L34,-41 C52,-41 64,-34 74,-21 L6,-19 Z',fill:'none',stroke:col,'stroke-width':w*0.7,opacity:0.75},g);
  E('path',{d:'M-104,12 L-90,12 M96,10 L106,10',fill:'none',stroke:col,'stroke-width':w*0.8,opacity:0.6},g);
  [[-58,30],[58,30]].forEach(([x,y])=>{
    E('circle',{cx:x,cy:y,r:23,fill:'#070d1c',stroke:col,'stroke-width':w},g);
    E('circle',{cx:x,cy:y,r:9,fill:'none',stroke:col,'stroke-width':w*0.7,opacity:0.7},g);
  });
  return g;
}

/* Van / service vehicle, faces +x */
function vanSide(parent,col,w){
  const g=G(parent); col=col||C.txt; w=w||2.6;
  E('path',{d:'M-96,26 L-96,-44 L26,-44 L26,-18 L56,-18 C74,-18 88,-6 92,10 L92,26 Z',
    fill:'#0a1326',stroke:col,'stroke-width':w,'stroke-linejoin':'round'},g);
  E('path',{d:'M32,-14 L56,-14 C68,-14 78,-6 82,4 L32,4 Z',fill:'none',stroke:col,'stroke-width':w*0.7,opacity:0.7},g);
  E('path',{d:'M-70,-34 L-70,-6 M-34,-34 L-34,-6',fill:'none',stroke:col,'stroke-width':w*0.6,opacity:0.4},g);
  [[-56,26],[56,26]].forEach(([x,y])=>{
    E('circle',{cx:x,cy:y,r:20,fill:'#070d1c',stroke:col,'stroke-width':w},g);
    E('circle',{cx:x,cy:y,r:7,fill:'none',stroke:col,'stroke-width':w*0.7,opacity:0.7},g);
  });
  return g;
}

/* Quadcopter, 3/4 front view. update(spinT) animates rotors. box=payload */
function droneRig(parent,col,payload){
  const g=G(parent); col=col||C.cyan;
  const arms=E('path',{d:'M-13,-3 L-44,-11 M13,-3 L44,-11 M-11,-7 L-29,-20 M11,-7 L29,-20'},g);
  Object.entries(strokeAttrs(col,2.6)).forEach(([k,v])=>arms.setAttribute(k,v));
  const rotors=[[-44,-11,21],[44,-11,21],[-29,-20,15],[29,-20,15]].map(([x,y,r])=>{
    const rg=G(g,{transform:`translate(${x},${y})`});
    E('ellipse',{cx:0,cy:0,rx:r,ry:r*0.26,fill:col,opacity:0.10},rg);
    E('ellipse',{cx:0,cy:0,rx:r,ry:r*0.26,fill:'none',stroke:col,'stroke-width':2,opacity:0.55},rg);
    const blade=E('line',{x1:-r,y1:0,x2:r,y2:0,stroke:col,'stroke-width':2.4,'stroke-linecap':'round',opacity:0.9},rg);
    E('line',{x1:0,y1:-3,x2:0,y2:3,stroke:col,'stroke-width':2.2,'stroke-linecap':'round'},rg);
    return {blade,r};
  });
  E('rect',{x:-17,y:-11,width:34,height:19,rx:8,fill:'#0a1326',stroke:col,'stroke-width':2.6},g);
  E('path',{d:'M-8,-2 L8,-2',stroke:col,'stroke-width':2,opacity:0.5,'stroke-linecap':'round'},g);
  const cam=E('circle',{cx:0,cy:12,r:6,fill:'#0a1326',stroke:col,'stroke-width':2.2},g);
  E('circle',{cx:0,cy:12,r:2,fill:col},g);
  let box=null;
  if(payload){
    box=G(g);
    E('path',{d:'M-7,8 L-7,16 M7,8 L7,16',stroke:col,'stroke-width':1.8,opacity:0.6},box);
    E('rect',{x:-13,y:16,width:26,height:19,rx:3,fill:'#0a1326',stroke:C.amber,'stroke-width':2.4},box);
    E('path',{d:'M-13,23 L13,23',stroke:C.amber,'stroke-width':1.6,opacity:0.7},box);
  }
  g.__update=(t)=>{
    const a=t*34;
    rotors.forEach((r,i)=>{
      const s=Math.cos(a+i*1.7);
      r.blade.setAttribute('transform',`scale(${Math.abs(s)<0.06?0.06:s},1)`);
    });
  };
  g.__box=box;
  return g;
}

/* Rounded-rect HUD chip with label text */
function chip(parent,x,y,txt,col,size){
  col=col||C.cyan; size=size||19;
  const g=G(parent,{transform:`translate(${x},${y})`});
  const wgt=txt.length*(size*0.62+1.8)+56;
  E('rect',{x:0,y:-size-8,width:wgt,height:size*2+4,rx:(size*2+4)/2,fill:'#070f20',stroke:col,'stroke-width':1.6,opacity:0.95},g);
  E('circle',{cx:20,cy:0,r:4,fill:col},g);
  T(g,txt,{x:36,y:1,'font-size':size,'font-weight':600,'letter-spacing':1.6,fill:col});
  g.__w=wgt;
  return g;
}

/* Building block with windows + label */
function building(parent,x,groundY,w,h,label,col){
  col=col||C.line2;
  const g=G(parent);
  E('rect',{x:x-w/2,y:groundY-h,width:w,height:h,rx:4,fill:'#0a1326',stroke:col,'stroke-width':2.4},g);
  E('rect',{x:x-w/2-14,y:groundY-h-12,width:w+28,height:14,rx:3,fill:'#0a1326',stroke:col,'stroke-width':2.4},g);
  const cols=Math.max(2,Math.floor(w/34)), rows=Math.max(2,Math.floor(h/40));
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    E('rect',{x:x-w/2+12+i*((w-24)/cols),y:groundY-h+22+j*((h-34)/rows),width:14,height:12,rx:1.5,
      fill:C.blue,opacity:((i*7+j*5)%4===0)?0.34:0.10},g);
  }
  if(label) T(g,label,{x:x,y:groundY+34,'font-size':18,'font-weight':600,'letter-spacing':4,'text-anchor':'middle',fill:C.mut});
  return g;
}

/* Map pin */
function pin(parent,x,y,col,scale){
  scale=scale||1;
  const g=G(parent,{transform:`translate(${x},${y}) scale(${scale})`});
  E('path',{d:'M0,0 C-14,-18 -20,-26 -20,-36 A20,20 0 1,1 20,-36 C20,-26 14,-18 0,0 Z',
    fill:'#0a1326',stroke:col,'stroke-width':2.6,'stroke-linejoin':'round'},g);
  E('circle',{cx:0,cy:-36,r:7,fill:col},g);
  return g;
}

/* dashed path helper: returns fn(p) that reveals path 0..1 */
function revealPath(node,len){
  node.setAttribute('stroke-dasharray',len);
  return p=>node.setAttribute('stroke-dashoffset',len*(1-p));
}
function pathLen(node){ return node.getTotalLength(); }

/* quadratic bezier point */
function qbez(x0,y0,cx,cy,x1,y1,p){
  const m=1-p;
  return [m*m*x0+2*m*p*cx+p*p*x1, m*m*y0+2*m*p*cy+p*p*y1];
}

/* =====================================================================
   Scene framework
   ===================================================================== */
const SCENES=[];
function addScene(id,t0,t1,num,label,build){
  const g=G(sceneLayer,{opacity:0});
  g.style.display='none';
  const inner=G(g);
  const update=build(inner,t1-t0);
  SCENES.push({id,t0,t1,num,label,g,inner,update});
}

/* =====================================================================
   00 - TITLE  (0.0 - 5.0)
   ===================================================================== */
addScene('title',0,5,'','',function(root){
  const ring=G(root,{transform:'translate(960,540)'});
  E('circle',{cx:0,cy:0,r:348,fill:'none',stroke:C.line,'stroke-width':1.5,opacity:0.7},ring);
  const arc=E('circle',{cx:0,cy:0,r:348,fill:'none',stroke:C.blue,'stroke-width':2.5,
    transform:'rotate(-90)','stroke-linecap':'round'},ring);
  const arcLen=2*Math.PI*348;
  arc.setAttribute('stroke-dasharray',arcLen);
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30, r0=i%5===0?330:339;
    E('line',{x1:Math.cos(a)*r0,y1:Math.sin(a)*r0,x2:Math.cos(a)*348,y2:Math.sin(a)*348,
      stroke:C.line2,'stroke-width':i%5===0?2:1,opacity:0.8},ring);
  }
  const kicker=T(root,'A CONCEPT FILM',{x:960,y:404,'font-size':20,'font-weight':600,
    'letter-spacing':11,'text-anchor':'middle',fill:C.blue});
  const l1=T(root,'WHEN EVERY MINUTE',{x:960,y:506,'font-size':92,'font-weight':800,
    'letter-spacing':3,'text-anchor':'middle',fill:'#ffffff'});
  const l2=T(root,'MATTERS',{x:960,y:604,'font-size':92,'font-weight':800,
    'letter-spacing':14,'text-anchor':'middle',fill:'#ffffff'});
  const rule=E('rect',{x:960,y:676,width:0,height:2,fill:C.cyan,opacity:0.9},root);
  const sub=T(root,'Drones for critical customer moments',{x:960,y:726,'font-size':26,
    'font-weight':400,'letter-spacing':4,'text-anchor':'middle',fill:C.mut});

  return function(lt){
    arc.setAttribute('stroke-dashoffset',arcLen*(1-eio(P(lt,0.3,4.4))));
    ring.setAttribute('opacity',0.55*P(lt,0.2,1.0));
    kicker.setAttribute('opacity',P(lt,0.35,1.0));
    kicker.setAttribute('transform',`translate(0,${lerp(14,0,eo(P(lt,0.35,1.2)))})`);
    [[l1,0.6],[l2,0.78]].forEach(([n,s])=>{
      n.setAttribute('opacity',P(lt,s,s+0.7));
      n.setAttribute('transform',`translate(0,${lerp(34,0,eo5(P(lt,s,s+1.3)))})`);
    });
    const rw=lerp(0,300,eo(P(lt,1.5,2.6)));
    rule.setAttribute('x',960-rw/2); rule.setAttribute('width',rw);
    sub.setAttribute('opacity',0.95*P(lt,1.9,2.8));
  };
});

/* =====================================================================
   01 - CUSTOMER EXPECTATIONS ARE EVOLVING  (5.0 - 13.0)
   ===================================================================== */
addScene('expect',5,13,'01','CUSTOMER EXPECTATIONS',function(root){
  /* left: waiting clock */
  const ring=G(root,{transform:'translate(600,560)'});
  E('circle',{cx:0,cy:0,r:210,fill:'none',stroke:C.line,'stroke-width':1.5},ring);
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30, r0=i%5===0?192:200;
    E('line',{x1:Math.cos(a)*r0,y1:Math.sin(a)*r0,x2:Math.cos(a)*210,y2:Math.sin(a)*210,
      stroke:C.line2,'stroke-width':i%5===0?2.5:1,opacity:0.9},ring);
  }
  const sweep=E('circle',{cx:0,cy:0,r:210,fill:'none',stroke:C.amber,'stroke-width':3,
    transform:'rotate(-90)','stroke-linecap':'round'},ring);
  const sLen=2*Math.PI*210; sweep.setAttribute('stroke-dasharray',sLen);
  const hand=E('line',{x1:0,y1:14,x2:0,y2:-168,stroke:C.amber,'stroke-width':3,'stroke-linecap':'round'},ring);
  E('circle',{cx:0,cy:0,r:6,fill:C.amber},ring);
  const clockNum=T(ring,'00:00',{x:0,y:-56,'font-size':78,'font-weight':700,'letter-spacing':2,
    'text-anchor':'middle',fill:'#ffffff'});
  const clockLab=T(ring,'MINUTES WAITING',{x:0,y:100,'font-size':17,'font-weight':600,
    'letter-spacing':6,'text-anchor':'middle',fill:C.mut});
  const carSm=carSide(ring,C.dim,2); carSm.setAttribute('transform','translate(0,18) scale(0.42)');
  carSm.setAttribute('opacity',0.5);

  /* right: moments */
  const head=T(root,'MOMENTS THAT DEFINE THE EXPERIENCE',{x:1110,y:258,'font-size':18,
    'font-weight':600,'letter-spacing':6,fill:C.blue});
  const items=[
    ['Customer waiting for vehicle delivery','M-14,4 L-10,4 M-14,4 C-14,-2 -9,-6 -2,-6 L6,-7 C10,-7 13,-4 15,0 L18,2 M-8,4 L10,4'],
    ['Customer stranded on the highway',''],
    ['Vehicle awaiting one critical part',''],
    ['Service advisor explaining the delay','']
  ];
  const tiles=items.map((it,i)=>{
    const y=326+i*116;
    const g=G(root,{transform:`translate(1110,${y})`});
    const box=E('rect',{x:0,y:0,width:700,height:92,rx:8,fill:'#080f20',stroke:C.line,'stroke-width':1.8},g);
    const bar=E('rect',{x:0,y:0,width:3,height:92,rx:1.5,fill:C.blue,opacity:0},g);
    const ico=G(g,{transform:'translate(52,46)'});
    if(i===0){
      carSide(ico,C.mut,3.4).setAttribute('transform','scale(0.20)');
      E('path',{d:'M26,-16 L26,-4 M20,-10 L32,-10',stroke:C.blue,'stroke-width':2.6,'stroke-linecap':'round'},ico);
    }else if(i===1){
      carSide(ico,C.mut,3.4).setAttribute('transform','scale(0.20)');
      E('path',{d:'M0,-30 L12,-10 L-12,-10 Z',fill:'none',stroke:C.amber,'stroke-width':2.4,'stroke-linejoin':'round'},ico);
      E('path',{d:'M0,-24 L0,-17',stroke:C.amber,'stroke-width':2.2,'stroke-linecap':'round'},ico);
    }else if(i===2){
      E('rect',{x:-17,y:-14,width:34,height:28,rx:3,fill:'none',stroke:C.mut,'stroke-width':2.6},ico);
      E('path',{d:'M-17,-4 L17,-4 M0,-14 L0,-4',stroke:C.mut,'stroke-width':2.2},ico);
      E('circle',{cx:16,cy:14,r:11,fill:'#080f20',stroke:C.amber,'stroke-width':2.4},ico);
      E('path',{d:'M16,8 L16,14 L20,17',stroke:C.amber,'stroke-width':2.2,'stroke-linecap':'round',fill:'none'},ico);
    }else{
      E('circle',{cx:-8,cy:-10,r:9,fill:'none',stroke:C.mut,'stroke-width':2.6},ico);
      E('path',{d:'M-24,16 C-24,4 -16,-1 -8,-1 C0,-1 8,4 8,16',fill:'none',stroke:C.mut,'stroke-width':2.6},ico);
      E('path',{d:'M14,-18 L34,-18 L34,-4 L24,-4 L19,2 L19,-4 L14,-4 Z',fill:'none',stroke:C.blue,'stroke-width':2.2,'stroke-linejoin':'round'},ico);
    }
    const tx=T(g,it[0],{x:104,y:47,'font-size':27,'font-weight':500,fill:C.txt});
    const tm=T(g,'',{x:672,y:47,'font-size':20,'font-weight':600,'text-anchor':'end',fill:C.amber});
    return {g,box,bar,tx,tm,ico};
  });
  const waits=['+ 00:26','+ 01:48','+ 02:35','+ 04:12'];

  return function(lt){
    const p=P(lt,0.2,7.2);
    sweep.setAttribute('stroke-dashoffset',sLen*(1-p));
    hand.setAttribute('transform',`rotate(${p*360*1.0})`);
    ring.setAttribute('opacity',P(lt,0.1,0.9));
    const mins=Math.floor(p*4+p*0.2), secs=Math.floor((p*252)%60);
    clockNum.textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
    clockNum.setAttribute('fill', p>0.6?'#ffd9a0':'#ffffff');
    head.setAttribute('opacity',P(lt,0.5,1.1));
    tiles.forEach((tl,i)=>{
      const s=0.9+i*0.62;
      const a=P(lt,s,s+0.55);
      tl.g.setAttribute('opacity',a);
      tl.g.setAttribute('transform',`translate(${lerp(1146,1110,eo(a))},${326+i*116})`);
      const hot=clamp(1-Math.abs(lt-(s+0.9))/1.4,0,1);
      tl.bar.setAttribute('opacity',hot);
      tl.box.setAttribute('stroke',hot>0.5?C.line2:C.line);
      tl.tx.setAttribute('opacity',lerp(0.55,1,hot*a));
      tl.tm.textContent=a>0.9?waits[i]:'';
      tl.tm.setAttribute('opacity',P(lt,s+0.45,s+0.9)*lerp(0.5,1,hot));
    });
  };
});

/* =====================================================================
   02 - THE CHALLENGE  (13.0 - 21.5)
   ===================================================================== */
addScene('challenge',13,21.5,'02','THE CHALLENGE',function(root){

addScene('eco',48.5,54.5,'06','A FOCUSED ECOSYSTEM',function(root){
  const TYPES=[
    {name:'PLANTS',col:C.blue,shape:'sq'},
    {name:'PARTS DISTRIBUTION CENTRES',col:C.cyan,shape:'di'},
    {name:'DEALERSHIPS',col:C.dim,shape:'ci'},
    {name:'SERVICE WORKSHOPS',col:C.green,shape:'rs'},
    {name:'RSA TEAMS',col:C.amber,shape:'tr'}
  ];
  const NODES=[
    [250,300,0],[268,742,0],
    [560,262,1],[520,640,1],[1010,330,1],[1108,760,1],
    [392,438,2],[700,880,2],[860,214,2],[1240,236,2],[1330,556,2],[690,470,2],[930,900,2],[1420,830,2],

  for(let j=1;j<10;j++) E('line',{x1:150,y1:124+j*74.8,x2:1650,y2:124+j*74.8,stroke:C.line,'stroke-width':1,opacity:0.35},map);

  const nodeEls=NODES.map(([x,y,ti])=>{
    const t=TYPES[ti], g=G(map,{opacity:0,transform:`translate(${x},${y})`});
    const c=t.col, r=ti===2?9:11;
    if(t.shape==='sq') E('rect',{x:-11,y:-11,width:22,height:22,fill:'#0a1326',stroke:c,'stroke-width':2.6},g);
    else if(t.shape==='di') E('path',{d:'M0,-13 L13,0 L0,13 L-13,0 Z',fill:'#0a1326',stroke:c,'stroke-width':2.6},g);
    else if(t.shape==='ci') E('circle',{cx:0,cy:0,r:r,fill:'#0a1326',stroke:c,'stroke-width':2.4},g);
    else if(t.shape==='rs') E('rect',{x:-10,y:-10,width:20,height:20,rx:5,fill:'#0a1326',stroke:c,'stroke-width':2.6},g);
    else E('path',{d:'M0,-13 L12,8 L-12,8 Z',fill:'#0a1326',stroke:c,'stroke-width':2.6,'stroke-linejoin':'round'},g);
    const halo=E('circle',{cx:0,cy:0,r:22,fill:'none',stroke:c,'stroke-width':2,opacity:0},g);
    return {g,halo,x,y,ti};
  });

  const linkEls=LINKS.map(([a,b])=>{
    const A=NODES[a],B=NODES[b];
    const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2-Math.abs(B[0]-A[0])*0.22-40;
    const d=`M${A[0]},${A[1]} Q${mx},${my} ${B[0]},${B[1]}`;
    const bg=E('path',{d,...strokeAttrs(C.cyan,2,0.22)},map);
    const ln=E('path',{d,...strokeAttrs(C.cyan,2.6,0.95)},map);
    const L=pathLen(ln); const show=revealPath(ln,L);
    const dot=E('circle',{cx:A[0],cy:A[1],r:5,fill:C.cyan,opacity:0},map);
    return {bg,ln,show,dot,A,B,mx,my};
  });

  /* legend */
  const leg=G(root,{transform:'translate(182,828)',opacity:0});
  let lx=0;
  TYPES.forEach(t=>{
    const g=G(leg,{transform:`translate(${lx},0)`});
    E('circle',{cx:0,cy:0,r:6,fill:t.col},g);
    T(g,t.name,{x:18,y:1,'font-size':17,'font-weight':600,'letter-spacing':3,fill:C.mut});
    lx+=t.name.length*12.2+72;
  });
  const focus=chip(root,906,94,'SELECTIVE DRONE CORRIDORS  ·  CRITICAL LINKS ONLY',C.cyan,20);

  return function(lt){
    map.setAttribute('opacity',P(lt,0,0.6));
    nodeEls.forEach((n,i)=>{
      const s=0.25+((i*37)%25)*0.038;
      const a=P(lt,s,s+0.45);
      n.g.setAttribute('opacity',a*(n.ti===2?0.7:0.95));
      n.g.setAttribute('transform',`translate(${n.x},${n.y}) scale(${lerp(0.5,1,eo5(a))})`);
    });
    leg.setAttribute('opacity',0.95*P(lt,1.2,1.8));
    focus.setAttribute('opacity',P(lt,2.6,3.1));
    linkEls.forEach((l,i)=>{
      const s=2.5+i*0.28;
      l.bg.setAttribute('opacity',0.2*P(lt,s,s+0.4));
      l.show(eio(P(lt,s,s+1.1)));
      l.ln.setAttribute('opacity',0.95*P(lt,s,s+0.3));
      const q=P(lt,s+0.3,s+1.5);
      const [px,py]=qbez(l.A[0],l.A[1],l.mx,l.my,l.B[0],l.B[1],eio(q));
      l.dot.setAttribute('cx',px); l.dot.setAttribute('cy',py);
      l.dot.setAttribute('opacity',(q>0&&q<1)?1:0);
    });
    nodeEls.forEach((n,i)=>{
      let hot=0;
      LINKS.forEach(([a,b],k)=>{ if(a===i||b===i) hot=Math.max(hot,P(lt,2.5+k*0.28,3.0+k*0.28)); });
      n.halo.setAttribute('opacity',hot*(0.25+0.35*pulse(lt,1.0)));
      n.halo.setAttribute('r',22+5*pulse(lt,1.0));
    });
  };
});

const CAPS=[
  [5.38,8.18,"It's not the journey that defines the experience."],
  [8.2,10.2,"It's how quickly support arrives."],
  [10.22,13.22,"Because when a vehicle stops… life doesn't."],

  [25.29,28.49,"Not replacing traditional logistics — complementing it."],
  [28.51,30.85,"Delivering critical parts faster, when every minute counts."],

  [54.53,57.61,"The future of mobility isn't about flying vehicles."],
  [57.63,59.52,"It's about delivering care faster."],
];
const SUPERS=[
  [30.9,32.45,'Faster Parts. Faster Repairs.'],
  [40.1,41.45,'Assess First. Respond Better.'],
  [46.9,48.45,'Improved Visibility. Faster Coordination.'],
];

/* =====================================================================
   seek
   ===================================================================== */
function seek(t){
  /* scenes */
  let active=null;
  for(const s of SCENES){
    const op=Math.min(P(t,s.t0-0.32,s.t0+0.06), 1-P(t,s.t1-0.32,s.t1+0.06));
    if(op<=0.002){ if(s.g.style.display!=='none') s.g.style.display='none'; continue; }
    if(s.g.style.display==='none') s.g.style.display='';
    s.g.setAttribute('opacity',op.toFixed(4));
    const lt=Math.max(0,t-s.t0);
    s.update(lt,t);
    const k=P(t,s.t0,s.t1), sc=lerp(1.0,1.035,k);
    s.inner.setAttribute('transform',`translate(960,540) scale(${sc.toFixed(4)}) translate(-960,-540)`);
    if(op>0.5) active=s;
  }
  /* background drift */
  gridRect.setAttribute('transform',`translate(${(-t*7)%64},${(-t*3)%64})`);

  /* scene label */
  if(active&&active.num){
    labWrap.setAttribute('opacity',(Math.min(P(t,active.t0+0.15,active.t0+0.6),1-P(t,active.t1-0.5,active.t1-0.15))).toFixed(3));
    labNum.textContent=active.num; labTxt.textContent=active.label;
  } else labWrap.setAttribute('opacity',0);

  /* captions */
  const capA=[0,0];
  for(let k=0;k<CAPS.length;k++){
    const c=CAPS[k];
    if(t<c[0]-0.20||t>c[1]+0.20) continue;
    const a=Math.min(P(t,c[0]-0.18,c[0]+0.02),1-P(t,c[1]-0.02,c[1]+0.18));
    if(a<=capA[k%2]) continue;
    capA[k%2]=a;
    const sl=capSlots[k%2];
    if(sl.txt.textContent!==c[2]) sl.txt.textContent=c[2];
    sl.txt.setAttribute('transform',`translate(0,${lerp(14,0,eo(P(t,c[0]-0.18,c[0]+0.26))).toFixed(2)})`);
    const bw=lerp(0,420,eo(P(t,c[0]-0.14,c[0]+0.42)));
    sl.bar.setAttribute('x',960-bw/2); sl.bar.setAttribute('width',bw);
  }
  capSlots.forEach((sl,i)=>sl.w.setAttribute('opacity',capA[i].toFixed(3)));

  /* supers */
  let sup=null;
  for(const s of SUPERS) if(t>=s[0]-0.35&&t<=s[1]+0.3) sup=s;
  if(sup){
    const a=Math.min(P(t,sup[0]-0.3,sup[0]+0.1),1-P(t,sup[1]-0.1,sup[1]+0.28));
    supWrap.setAttribute('opacity',a.toFixed(3));
    if(supTxt.textContent!==sup[2]) supTxt.textContent=sup[2];
    supTxt.setAttribute('transform',`translate(0,${lerp(20,0,eo(P(t,sup[0]-0.3,sup[0]+0.5))).toFixed(2)})`);
    const rw=lerp(0,240,eo(P(t,sup[0]-0.25,sup[0]+0.6)));
    supRule.setAttribute('x',960-rw/2); supRule.setAttribute('width',rw);
    supScrim.setAttribute('opacity',(a*0.66).toFixed(3));
  } else { supWrap.setAttribute('opacity',0); supScrim.setAttribute('opacity',0); }

  /* global fade in / out */
  const fade=Math.min(P(t,0,0.7),1-P(t,59.45,60.0));
  svg.style.opacity=fade.toFixed(3);
}
window.seek=seek;
window.__ready=true;
seek(0);
